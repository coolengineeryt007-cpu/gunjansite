<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hero Banner Render</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@200;300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1F0B17;
      color: #F0E4D3;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
      width: 100%;
      height: 100%;
    }

    .banner-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #2A1320;
      overflow: hidden;
    }

    .bg-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      filter: brightness(0.68) contrast(1.1);
    }

    .vignette-overlay {
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(ellipse 70% 60% at 50% 45%, rgba(42, 19, 32, 0.15) 0%, rgba(20, 8, 15, 0.75) 75%, rgba(10, 4, 8, 0.95) 100%),
        linear-gradient(180deg, rgba(31, 11, 23, 0.8) 0%, transparent 20%, transparent 80%, rgba(31, 11, 23, 0.9) 100%);
      pointer-events: none;
    }

    .hero-crest-box {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 0 20px 20px 20px;
    }

    .hero-brand-logo {
      width: 270px;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 0 50px rgba(212, 169, 74, 0.55)) drop-shadow(0 15px 30px rgba(0, 0, 0, 0.9));
      margin-bottom: 28px;
    }

    .hero-title-main {
      font-family: 'Cinzel', serif;
      font-size: 64px;
      font-weight: 500;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      background: linear-gradient(180deg, #FFFFFF 0%, #F5E5C9 35%, #D4A94A 70%, #9B7423 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 20px rgba(0, 0, 0, 0.85));
      margin-bottom: 16px;
      padding-left: 0.35em;
    }

    .hero-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      width: 440px;
      margin-bottom: 18px;
    }
    .hero-divider::before, .hero-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, #D4A94A, transparent);
    }
    .hero-divider span {
      color: #D4A94A;
      font-size: 14px;
    }

    .hero-sub-text {
      font-size: 16px;
      font-weight: 300;
      letter-spacing: 0.45em;
      text-transform: uppercase;
      color: #F0E4D3;
      opacity: 0.9;
      padding-left: 0.45em;
      margin-bottom: 36px;
    }

    .hero-cta-btn {
      background: linear-gradient(90deg, #C5983A 0%, #E6BF62 50%, #C5983A 100%);
      color: #1F0B17;
      font-size: 13px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      font-weight: 600;
      padding: 16px 42px;
      border-radius: 9999px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 25px rgba(212, 169, 74, 0.4);
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }

    /* Mobile mode overrides */
    body.is-mobile {
      width: 1080px;
      height: 1440px;
    }
    body.is-mobile .hero-brand-logo {
      width: 320px;
      margin-bottom: 36px;
    }
    body.is-mobile .hero-title-main {
      font-size: 54px;
      letter-spacing: 0.25em;
      padding-left: 0.25em;
      margin-bottom: 20px;
    }
    body.is-mobile .hero-divider {
      width: 380px;
      margin-bottom: 22px;
    }
    body.is-mobile .hero-sub-text {
      font-size: 16px;
      letter-spacing: 0.32em;
      padding-left: 0.32em;
      margin-bottom: 44px;
    }
    body.is-mobile .hero-cta-btn {
      font-size: 15px;
      padding: 20px 52px;
    }
  </style>
</head>
<body>

  <div class="banner-canvas">
    <img src="hero-bg.jpg" class="bg-img" alt="Luxury Plinths">
    <div class="vignette-overlay"></div>
    <div class="hero-crest-box">
      <img src="Logo.png" class="hero-brand-logo" alt="YOJAKI Crest">
      <h1 class="hero-title-main">YOJAKI DE LUXE</h1>
      <div class="hero-divider"><span>✦</span></div>
      <p class="hero-sub-text">ARTISANAL HAUTE PARFUMERIE · NEW DELHI</p>
      <div class="hero-cta-btn">EXPLORE THE CREATIONS <span>→</span></div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.get('mobile') === '1') {
      document.body.classList.add('is-mobile');
    }
  </script>
</body>
</html>
